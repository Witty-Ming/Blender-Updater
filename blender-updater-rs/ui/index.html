<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blender 更新器</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <!-- 自绘标题栏 -->
      <header class="titlebar">
        <div class="tb-drag" data-tauri-drag-region>
          <span class="tb-logo"></span>
          <span class="tb-name">Blender 更新器</span>
          <span class="tb-ver" id="tb-version">0.3.0</span>
        </div>
        <div class="tb-actions">
          <button class="tb-btn" id="btn-settings" title="设置">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none"
                 stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
                 stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="3.1"/>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1.08-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9v.09a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
          </button>
          <span class="tb-sep"></span>
          <button class="tb-btn win" id="btn-min" title="最小化">
            <svg viewBox="0 0 12 12" width="12" height="12"><path stroke="currentColor" stroke-width="1" d="M2 6h8"/></svg>
          </button>
          <button class="tb-btn win" id="btn-max" title="最大化">
            <svg viewBox="0 0 12 12" width="12" height="12"><rect x="2.5" y="2.5" width="7" height="7" fill="none" stroke="currentColor" stroke-width="1"/></svg>
          </button>
          <button class="tb-btn win close" id="btn-close" title="关闭">
            <svg viewBox="0 0 12 12" width="12" height="12"><path stroke="currentColor" stroke-width="1.1" d="M3 3l6 6M9 3l-6 6"/></svg>
          </button>
        </div>
      </header>

      <div class="body">
        <!-- 侧栏 -->
        <aside class="sidebar">
          <div class="side-head">
            <div class="side-title">安装目录</div>
            <div class="side-count" id="side-count">—</div>
          </div>
          <div class="side-list" id="install-list"></div>
          <div class="side-foot">
            <button class="ghost-btn wide" id="btn-add">＋ 添加目录</button>
            <button class="ghost-btn wide" id="btn-rescan">↻ 重新扫描</button>
          </div>
        </aside>

        <!-- 主区 -->
        <main class="main">
          <section class="view" id="view-main">
            <div class="card head-card">
              <div class="head-left">
                <div class="ver-big" id="cur-version">—</div>
                <div class="ver-sub" id="cur-sub">请选择左侧的 Blender 安装</div>
              </div>
              <div class="head-right">
                <div class="path-line" id="cur-path">—</div>
                <div class="head-controls">
                  <div class="segmented" id="channel-seg">
                    <button class="seg active" data-channel="release">稳定版</button>
                    <button class="seg" data-channel="daily">每日构建</button>
                  </div>
                  <button class="primary" id="btn-check">检查更新</button>
                </div>
              </div>
            </div>

            <div id="card-slot"></div>

            <div class="actions">
              <button class="act act-main" id="btn-update" disabled>立即更新</button>
              <button class="act" id="btn-backup">配置备份</button>
              <button class="act" id="btn-open">打开目录</button>
            </div>

            <div class="card progress-card" id="progress-card" hidden>
              <div class="prog-head">
                <span class="prog-phase" id="prog-phase">准备更新</span>
                <span class="prog-pct" id="prog-pct">0%</span>
              </div>
              <div class="prog-bar"><div class="prog-fill" id="prog-fill"></div></div>
              <div class="prog-detail" id="prog-detail"></div>
            </div>

            <div class="statusbar">
              <span class="dot" id="status-dot"></span>
              <span id="status-text">就绪</span>
            </div>
          </section>

          <!-- 设置页 -->
          <section class="view" id="view-settings" hidden>
            <div class="set-head">
              <button class="ghost-btn" id="btn-set-back">← 返回</button>
              <div class="set-title">设置</div>
            </div>

            <div class="card set-card">
              <div class="set-group-title">配置备份</div>
              <div class="set-row">
                <div class="set-label">备份位置</div>
                <div class="set-hint">快照只保存 portable/config。修改位置后，已有快照会自动迁移过去，不会残留两份。</div>
                <div class="set-field">
                  <input class="input mono grow" id="set-snap-dir" readonly />
                  <button class="ghost-btn" id="btn-snap-browse">浏览…</button>
                  <button class="ghost-btn" id="btn-snap-reset">恢复默认</button>
                </div>
                <div class="set-note" id="set-snap-note"></div>
              </div>

              <div class="set-row inline">
                <div>
                  <div class="set-label">自动保留份数</div>
                  <div class="set-hint">每个安装目录最多保留的自动快照数量，手动快照永久保留。</div>
                </div>
                <div class="stepper">
                  <button class="step-btn" id="set-keep-minus">−</button>
                  <input class="input num" id="set-keep" type="number" min="1" max="50" value="5" />
                  <button class="step-btn" id="set-keep-plus">＋</button>
                </div>
              </div>

              <div class="set-row inline">
                <div>
                  <div class="set-label">更新前自动备份</div>
                  <div class="set-hint">执行覆盖式更新前，先把 portable/config 存一份，便于回退。</div>
                </div>
                <label class="switch"><input type="checkbox" id="set-auto-backup" /><span class="slider"></span></label>
              </div>
            </div>

            <div class="card set-card">
              <div class="set-group-title">下载</div>
              <div class="set-row inline">
                <div>
                  <div class="set-label">优先使用国内镜像</div>
                  <div class="set-hint">优先从清华 / 阿里镜像下载，失败时自动回退官方源。</div>
                </div>
                <label class="switch"><input type="checkbox" id="set-prefer-mirror" /><span class="slider"></span></label>
              </div>
            </div>

            <div class="card set-card">
              <div class="set-group-title">关于</div>
              <div class="about">
                <div class="about-logo"></div>
                <div class="about-main">
                  <div class="about-name">Blender 更新器 <span class="about-ver" id="set-version">v0.3.0</span></div>
                  <div class="about-line">
                    <span class="muted">作者</span>
                    <a class="author-link" id="set-author">WittyMing</a>
                  </div>
                  <div class="about-line">
                    <span class="muted">数据目录</span>
                    <a class="author-link mono" id="set-data-dir">—</a>
                  </div>
                </div>
              </div>
            </div>

            <div class="set-foot">
              <span class="set-status" id="set-status"></span>
              <button class="primary" id="btn-save-settings">保存设置</button>
            </div>
          </section>
        </main>
      </div>
    </div>

    <!-- 备份浮层 -->
    <div class="modal-mask" id="backup-mask" hidden>
      <div class="modal">
        <div class="modal-head">
          <div>
            <div class="modal-title">配置备份</div>
            <div class="modal-sub" id="backup-path">—</div>
          </div>
          <button class="tb-btn" id="backup-close" title="关闭">
            <svg viewBox="0 0 12 12" width="12" height="12"><path stroke="currentColor" stroke-width="1.1" d="M3 3l6 6M9 3l-6 6"/></svg>
          </button>
        </div>
        <div class="modal-bar">
          <button class="ghost-btn" id="btn-make-snapshot">＋ 立即备份</button>
          <button class="ghost-btn" id="btn-open-snapdir">打开备份文件夹</button>
          <div class="spacer"></div>
          <span class="muted small">保留</span>
          <select class="input small-sel" id="keep-select">
            <option value="3">3 份</option>
            <option value="5">5 份</option>
            <option value="10">10 份</option>
            <option value="20">20 份</option>
          </select>
        </div>
        <div class="snap-list" id="snap-list"></div>
        <div class="modal-foot"><span id="snap-count">共 0 份备份</span></div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
